services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=joaquin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=medical_booking
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres: